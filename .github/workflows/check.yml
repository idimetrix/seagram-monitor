name: seagram-health
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
permissions: { issues: write, contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq whois >/dev/null
      - id: run
        run: ./check.sh | tee out.txt; echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.rc != '0'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          open=$(gh issue list --label outage --state open --json number -q '.[0].number')
          if [ -z "$open" ]; then gh label create outage --color d73a4a 2>/dev/null || true; gh issue create --title "Seagram health check failing" --label outage --body-file out.txt
          else gh issue comment "$open" --body-file out.txt; fi
          exit 1
      - if: steps.run.outputs.rc == '0'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: for n in $(gh issue list --label outage --state open --json number -q '.[].number'); do gh issue close "$n" -c "Recovered: all checks pass."; done
